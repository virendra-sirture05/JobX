networks:
  job-portal-net:
    driver: bridge
volumes:
  userdb_data:
  companydb_data:
  jobdb_data:
  applicationdb_data:
  paymentdb_data:
  subscriptiondb_data:
  preferencedb_data:
  resumedb_data:
services:
#
#  # ============================================================
#  # DATABASES (One MySQL container per microservice)
#  # ============================================================
#
  userdb:
    image: mysql:8.4
    container_name: job-portal-userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: job-portal-user-service
      MYSQL_USER: root
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - userdb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - job-portal-net

  companydb:
    image: mysql:8.4
    container_name: job-portal-companydb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: job_portal_company
      MYSQL_USER: jobportal
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - companydb_data:/var/lib/mysql
    healthcheck:
