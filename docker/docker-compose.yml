#  # ============================================================
#  # SPRING CLOUD
#  # ============================================================
#
  discovery:
    image: ritesh8554/job-portal-service-registry:latest
    container_name: job-portal-service-registry
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - job-portal-net

  config-server:
    image: ritesh8554/job-portal-config-server:latest
    container_name: job-portal-config-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8888:8888"
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - job-portal-net

  gateway:
    image: ritesh8554/job-portal-api-gateway:latest
    container_name: job-portal-api-gateway
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5000:5000"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net

  user-service:
    image: ritesh8554/job-portal-user-service:latest
    container_name: job-portal-user-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8083:8083"
    depends_on:
      userdb:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_URL: jdbc:mysql://userdb:3306/job-portal-user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: jobportal
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net